services:
  server:
    build: ./server
    volumes:
      - ./data:/data
    restart: always

  nginx:
    image: nginx:alpine
    environment:
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:-localhost}
      TRACKER_HTTPS_PORT: ${TRACKER_HTTPS_PORT:-8443}
    ports:
      - "${TRACKER_HTTP_PORT:-80}:80"
      - "${TRACKER_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${NGINX_HTPASSWD_FILE:?Set NGINX_HTPASSWD_FILE to a local htpasswd file}:/etc/nginx/.htpasswd:ro
    depends_on:
      - server
    restart: always
