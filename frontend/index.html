<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DL Experiment Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <h1 class="logo" onclick="app.navigate('home')">🔬 DL Experiment Tracker</h1>
                <nav id="breadcrumb" class="breadcrumb"></nav>
            </div>
            <div class="header-right" id="header-right">
                <!-- 由 JS 动态渲染 -->
            </div>
        </header>

        <!-- 主内容区域 -->
        <main id="main-content" class="main-content">
            <!-- 页面通过 JS 动态渲染 -->
        </main>

        <!-- 全局 Modal 容器 -->
        <div id="modal-container"></div>

        <!-- Toast 通知 -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- 快捷键提示 -->
    <div id="keyboard-help" style="display:none;position:fixed;bottom:24px;right:24px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:16px 20px;box-shadow:var(--shadow-xl);z-index:500;font-size:12px;color:var(--text-secondary);max-width:280px;">
        <div style="font-weight:600;margin-bottom:8px;color:var(--text-primary);">⌨️ 快捷键</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>返回首页</span><span class="kbd">Esc</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>切换主题</span><span class="kbd">Ctrl+D</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>批量选择</span><span class="kbd">Ctrl+B</span></div>
        <div style="display:flex;justify-content:space-between;"><span>关闭提示</span><span class="kbd">?</span></div>
    </div>

    <script src="sync.js"></script>
    <script src="data.js"></script>
    <script src="parser.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
